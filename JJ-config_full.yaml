# Clash / Hako 配置
# 依据官方规则编制 参考 https://Clash.md
# 更新日期：2026-09-10
# 配置下载地址：https://raw.githubusercontent.com/sydneygao/JJ-clash-config/main/JJ-config_full.yaml
# 使用前请将 Airport1.url 替换为你信任的 Clash / mihomo 订阅地址。
# 不要把含有 Token、用户名或密码的真实订阅地址提交到公开仓库。

# 常规设置
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
# DNS
# Hako 会在 Apple Packet Tunnel 内管理 DNS 与 TUN；无需配置监听端口或 dns-hijack。
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true

  # 仅使用纯 IP 引导解析 DNS 服务器域名
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 主 DNS
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 以下域名返回真实 IP，不分配 Fake IP
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'

    # 小米
    - '+.mi.com'
    - '+.xiaomi.com'
    - '+.xiaomi.net'
    - '+.miui.com'

    # Google Lens / Voice
    - 'lens.l.google.com'

    # Nintendo Switch
    - '*.n.n.srv.nintendo.net'

    # PlayStation
    - '+.stun.playstation.net'
    
    # Xbox
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'
    
    # Microsoft 网络连通性检测
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'

# 记住手动选择和 Fake IP 映射
profile:
  # 保存策略组选择
  store-selected: true
  # 保存 Fake-IP 映射
  store-fake-ip: true

# 远程代理集
proxy-providers:
  Airport1:
    type: http
    url: 'https://example.com/your-profile.yaml' # 替换为机场订阅地址
    path: ./providers/Airport1.yaml
    interval: 43200
    filter: '^(?!(?:.*流量.*|.*时间.*|.*到期.*)).*$'
    health-check:
      enable: true
      url: 'https://www.gstatic.com/generate_204'
      interval: 600
      lazy: true
      
# 策略组
proxy-groups:
  - name: 默认代理
    type: select
    proxies:
      - 香港自动
      - 香港手动
      - 日本自动
      - 日本手动
      - 新加坡自动
      - 新加坡手动
      - 台湾自动
      - 台湾手动
      - 美国自动
      - 美国手动
      - 手动选择
      - DIRECT
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png'

  # 通用代理策略锚点 PR：普通服务组复用同一候选列表
  - &PR
    name: Google
    type: select
    proxies: [默认代理, 香港自动, 香港手动, 日本自动, 日本手动, 新加坡自动, 新加坡手动, 台湾自动, 台湾手动, 美国自动, 美国手动, 手动选择, DIRECT, REJECT]
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png'

  - name: Apple
    type: select
    proxies: [DIRECT, 默认代理, 香港自动, 香港手动, 日本自动, 日本手动, 新加坡自动, 新加坡手动, 台湾自动, 台湾手动, 美国自动, 美国手动, 手动选择, REJECT]
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple_2.png'

  - name: Microsoft
    type: select
    proxies: [DIRECT, 默认代理, 香港自动, 香港手动, 日本自动, 日本手动, 新加坡自动, 新加坡手动, 台湾自动, 台湾手动, 美国自动, 美国手动, 手动选择, REJECT]
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Windows.png'
 
  - name: Ai
    <<: *PR
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png'
    
  - name: Social
    <<: *PR
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Facebook.png'

  - name: Games
    <<: *PR
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png'

  - name: NETFLIX
    <<: *PR
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png'

  - name: Spotify
    <<: *PR
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png'

  - name: PayPal
    <<: *PR
    icon: 'https://raw.githubusercontent.com/Orz-3/mini/master/Color/Paypal.png'

  - name: Shield
    <<: *PR
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Lock.png'

  - name: 漏网之鱼
    <<: *PR
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png'

  # 港 / 日 / 新 / 台 / 美：自动测速组（隐藏），供上层策略组调用
  - name: 香港自动
    type: url-test
    use: [Airport1]
    filter: '(?i)(?:香港|港|HK|HKG|Hong[\s_-]*Kong)'
    url: 'https://www.gstatic.com/generate_204'
    interval: 600
    tolerance: 20
    lazy: true
    hidden: true
    icon: 'https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png'

  - name: 日本自动
    type: url-test
    use: [Airport1]
    filter: '(?i)(?:日本|日|JP|JPN|Japan)'
    url: 'https://www.gstatic.com/generate_204'
    interval: 600
    tolerance: 20
    lazy: true
    hidden: true
    icon: 'https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png'

  - name: 新加坡自动
    type: url-test
    use: [Airport1]
    filter: '(?i)(?:新加坡|新|SG|SGP|Singapore)'
    url: 'https://www.gstatic.com/generate_204'
    interval: 600
    tolerance: 20
    lazy: true
    hidden: true
    icon: 'https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png'

  - name: 台湾自动
    type: url-test
    use: [Airport1]
    filter: '(?i)(?:台湾|台灣|🇹🇼|\bTW\b|\bTWN\b|Taiwan|Taipei|TPE)'
    url: 'https://www.gstatic.com/generate_204'
    interval: 600
    tolerance: 20
    lazy: true
    hidden: true
    icon: 'https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png'

  - name: 美国自动
    type: url-test
    use: [Airport1]
    filter: '(?i)(?:美国|美|United\s*States|UnitedStates|\bUS\b|\bUSA\b)'
    url: 'https://www.gstatic.com/generate_204'
    interval: 600
    tolerance: 20
    lazy: true
    hidden: true
    icon: 'https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png'

  # 港 / 日 / 新 / 台 / 美：区域手动选择组（显示）
  - name: 香港手动
    type: select
    use: [Airport1]
    filter: '(?i)(?:香港|港|HK|HKG|Hong[\s_-]*Kong)'
    hidden: false
    icon: 'https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png'

  - name: 日本手动
    type: select
    use: [Airport1]
    filter: '(?i)(?:日本|日|JP|JPN|Japan)'
    hidden: false
    icon: 'https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png'

  - name: 新加坡手动
    type: select
    use: [Airport1]
    filter: '(?i)(?:新加坡|新|SG|SGP|Singapore)'
    hidden: false
    icon: 'https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png'

  - name: 台湾手动
    type: select
    use: [Airport1]
    filter: '(?i)(?:台湾|台灣|🇹🇼|\bTW\b|\bTWN\b|Taiwan|Taipei|TPE)'
    hidden: false
    icon: 'https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png'

  - name: 美国手动
    type: select
    use: [Airport1]
    filter: '(?i)(?:美国|美|United\s*States|UnitedStates|\bUS\b|\bUSA\b)'
    hidden: false
    icon: 'https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png'

  - name: 手动选择
    type: select
    use: [Airport1]
    hidden: false
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png'

