# 分流规则
rules:
  # 局域网规则
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  # 自定义前置规则
  - DOMAIN-SUFFIX,ztna-dingtalk.com,DIRECT
  - DOMAIN-SUFFIX,unpkg.com,DIRECT
  - DOMAIN-SUFFIX,jsdelivr.net,DIRECT
  - DOMAIN-SUFFIX,xhscdn.com,DIRECT
  - DOMAIN-SUFFIX,theradioapp.com,DIRECT # TheRadioApp
  - DOMAIN-SUFFIX,streamtheworld.com,DIRECT # TheRadioApp
  - DOMAIN-SUFFIX,clashmi.app,默认代理
  - DOMAIN-SUFFIX,clash.md,默认代理
  - DOMAIN-SUFFIX,stash.wiki,默认代理
  - DOMAIN-SUFFIX,overcast.fm,默认代理 # overcast
  - DOMAIN-SUFFIX,overcast-cdn.com,默认代理 # overcast
  - DOMAIN-SUFFIX,jpush.cn,默认代理
  - RULE-SET,github_domain,默认代理 # Github
  
  # Ai前置防风控
  - RULE-SET,ai_domain,Ai
  
  # AI 补充域名规则：四源验证后仅保留服务专属性较高、上游可能未覆盖的域名
  # ChatGPT / OpenAI
  - DOMAIN-SUFFIX,searchgpt.com,Ai
  - DOMAIN,cdn.openaimerge.com,Ai
  # Gemini / Google AI
  - DOMAIN-SUFFIX,gemini.googleusercontent.com,Ai
  - DOMAIN,webchannel-robinfrontend-pa.googleapis.com,Ai
  # Claude / Anthropic
  - DOMAIN-SUFFIX,claudeusercontent.com,Ai
  # Microsoft Copilot
  - DOMAIN-SUFFIX,copilot.cloud.microsoft,Ai
  - DOMAIN-SUFFIX,copilot.microsoft.com,Ai
  - DOMAIN-SUFFIX,copilotstudio.microsoft.com,Ai
  - DOMAIN,m365.cloud.microsoft,Ai
  # Google含YouTube
  - RULE-SET,google_domain,Google

  # 社交通信
  - RULE-SET,whatsapp_domain,Social
  - RULE-SET,instagram_domain,Social
  - RULE-SET,facebook_domain,Social
  - RULE-SET,snapchat_domain,Social
  - RULE-SET,telegram_domain,Social
  - RULE-SET,twitter_domain,Social
  - RULE-SET,discord_domain,Social

  # 微软
  - RULE-SET,microsoft_domain,Microsoft

  # Apple
  - RULE-SET,apple_domain,Apple

  # 媒体
  - RULE-SET,spotify_domain,Spotify
  - RULE-SET,netflix_domain,NETFLIX
  # 儿童保护
  - RULE-SET,porn_domain,Shield
  - DOMAIN-SUFFIX,91porn.com,Shield

  # 游戏
  - RULE-SET,games_domain,Games
  - DOMAIN-SUFFIX,2ksports.com,Games
  - DOMAIN-SUFFIX,marketingcloudapis.com,Games

  # 支付
  - RULE-SET,paypal_domain,PayPal

  # 国内域名
  - RULE-SET,cn_domain,DIRECT
  # IP规则后置
  - RULE-SET,telegram_ip,Social,no-resolve
  - RULE-SET,twitter_ip,Social,no-resolve
  - RULE-SET,apple_ip,Apple,no-resolve
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,netflix_ip,NETFLIX,no-resolve

  # ASN 补充规则（四源验证：Netify + BGP/IPinfo + 官方/上游规则集 + 当前配置交叉检查）
  # 仅使用厂商/服务专属度较高的 ASN，避免 Cloudflare / AWS / Azure / Google 等共享基础设施 ASN
  # Claude / Anthropic
  - IP-ASN,399358,Ai,no-resolve
  # WhatsApp
  - IP-ASN,11917,Social,no-resolve
  # Snapchat
  - IP-ASN,395291,Social,no-resolve
  # Meta Facebook / Instagram / WhatsApp
  - IP-ASN,32934,Social,no-resolve
  # GitHub
  - IP-ASN,36459,默认代理,no-resolve
  # PayPal
  - IP-ASN,1449,PayPal,no-resolve
  - IP-ASN,17012,PayPal,no-resolve
  - IP-ASN,26444,PayPal,no-resolve
  - IP-ASN,395313,PayPal,no-resolve
  # 2K Games
  - IP-ASN,395856,Games,no-resolve
  # Take-Two Interactive
  - IP-ASN,46555,Games,no-resolve
  - IP-ASN,394977,Games,no-resolve
  - IP-ASN,54107,Games,no-resolve
  - IP-ASN,202021,Games,no-resolve
  # Steam / Valve
  - IP-ASN,32590,Games,no-resolve
  # PlayStation / Sony
  - IP-ASN,33353,Games,no-resolve
  # Nintendo
  - IP-ASN,11278,Games,no-resolve # Nintendo of America
  - IP-ASN,152877,Games,no-resolve # Nintendo Japan
  # Roblox
  - IP-ASN,22697,Games,no-resolve
  - IP-ASN,11281,Games,no-resolve
  # Telegram
  # 定期按 https://cdn.jsdelivr.net/gh/budaobu/rules@main/lists/telegram_asn.list 更新，并与 Netify/BGP 交叉验证
